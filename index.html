<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Vocab · Учи слова легко</title>
<style>
:root{
  --primary:#7c3aed;
  --primary-2:#a855f7;
  --primary-soft:#f3e8ff;
  --success:#10b981;
  --success-soft:#d1fae5;
  --warning:#f59e0b;
  --warning-soft:#fef3c7;
  --danger:#ef4444;
  --danger-soft:#fee2e2;
  --text:#1e1b4b;
  --muted:#6b7280;
  --border:#e5e7eb;
  --card:#ffffff;
  --bg:#faf5ff;
  --radius:18px;
  --shadow:0 4px 20px rgba(124,58,237,.08);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg);position:relative}

/* Header */
.header{background:linear-gradient(135deg,#7c3aed 0%,#c026d3 100%);color:#fff;padding:calc(.9rem + var(--safe-top)) 1rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0;box-shadow:0 4px 16px rgba(124,58,237,.25)}
.header .btn-icon{width:44px;height:44px;border:none;background:rgba(255,255,255,.2);border-radius:14px;color:#fff;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.header .btn-icon:active{background:rgba(255,255,255,.35)}
.header .title{flex:1;font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.stats{display:flex;gap:.4rem;font-size:.8rem;align-items:center}
.stats .pill{background:rgba(255,255,255,.25);padding:.25rem .6rem;border-radius:999px;font-weight:700;backdrop-filter:blur(4px)}
.stats .streak{font-size:1rem}

/* Due bar */
.due-bar{display:none;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:linear-gradient(90deg,#fef3c7,#fde68a);border-bottom:2px solid #f59e0b;color:#92400e;font-size:.9rem;font-weight:700;cursor:pointer}
.due-bar.visible{display:flex}
.due-bar span:last-child{font-size:1.1rem}

/* Main */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem .9rem calc(5.5rem + var(--safe-bottom))}

/* Bottom nav — teen friendly */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:.5rem 0 calc(.5rem + var(--safe-bottom));z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;border:none;background:transparent;padding:.4rem .6rem;font-size:.7rem;font-weight:700;color:var(--muted);cursor:pointer;min-width:64px;border-radius:12px;transition:all .15s}
.nav-btn .icon{font-size:1.45rem;line-height:1}
.nav-btn.active{color:var(--primary);background:var(--primary-soft)}
.nav-btn:active{transform:scale(.95)}

/* Overlay & side menu */
.overlay{position:fixed;inset:0;background:rgba(30,27,75,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.side-menu{position:fixed;top:0;left:0;width:min(310px,88vw);height:100%;background:var(--card);z-index:60;transform:translateX(-105%);transition:transform .3s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding-top:var(--safe-top);box-shadow:8px 0 32px rgba(0,0,0,.15);overflow-y:auto}
.side-menu.open{transform:translateX(0)}
.menu-header{padding:1.25rem 1.2rem 1rem;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-size:1.15rem;font-weight:800}
.menu-section{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:1rem 1.2rem .4rem;font-weight:800}
.menu-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:none;background:transparent;padding:.85rem 1.2rem;font-size:1rem;font-weight:650;color:var(--text);cursor:pointer;border-radius:0}
.menu-item:active{background:var(--primary-soft);color:var(--primary)}
.menu-item .mi-icon{font-size:1.35rem;width:28px;text-align:center}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(124,58,237,.08);padding:1.1rem;margin-bottom:.85rem}
.unit-card,.lesson-card{display:flex;align-items:center;gap:1rem;cursor:pointer;transition:transform .15s}
.unit-card:active,.lesson-card:active{transform:scale(.97)}
.unit-num{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.unit-info{flex:1;min-width:0}
.unit-info h3{font-size:1.05rem;font-weight:750;letter-spacing:-.01em}
.unit-info p{font-size:.82rem;color:var(--muted);margin-top:.2rem}
.progress-mini{height:6px;background:#e9d5ff;border-radius:3px;margin-top:.5rem;overflow:hidden}
.progress-mini span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:3px;transition:width .3s}
.badge{font-size:.75rem;background:var(--primary-soft);color:var(--primary);padding:.25rem .55rem;border-radius:999px;font-weight:750}
.badge.empty{background:#f3f4f6;color:var(--muted)}

/* Welcome / tip */
.welcome{background:linear-gradient(135deg,#f3e8ff,#fce7f3);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-bottom:1rem;border:1px solid rgba(124,58,237,.12)}
.welcome h2{font-size:1.05rem;font-weight:800;margin-bottom:.3rem}
.welcome p{font-size:.88rem;color:var(--muted);line-height:1.4}

/* Word chips */
.word-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.word-chip{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:.85rem .5rem;text-align:center;cursor:pointer;box-shadow:var(--shadow);min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .15s}
.word-chip:active{transform:scale(.96)}
.word-chip.learned{border-color:var(--success);background:var(--success-soft)}
.word-chip.difficult{border-color:var(--warning);background:var(--warning-soft)}
.word-chip.custom{border-style:dashed;border-color:#a855f7}
.word-chip .emoji{font-size:1.7rem;line-height:1.2}
.word-chip .term{font-weight:700;font-size:.82rem;margin-top:.25rem;word-break:break-word;line-height:1.25}

/* Term detail */
.term-big{font-size:1.55rem;font-weight:800;color:var(--primary);text-align:center;letter-spacing:-.02em}
.phonetic{text-align:center;color:var(--muted);font-size:.9rem;font-style:italic;margin:.3rem 0 .5rem}
.illustration{text-align:center;font-size:3.2rem;margin:.5rem 0}
.meaning-box{background:#f5f3ff;border-left:4px solid var(--primary);padding:.85rem 1rem;border-radius:0 12px 12px 0;margin:.6rem 0;font-size:.95rem;line-height:1.4}
.example-box{background:var(--success-soft);border-left:4px solid var(--success);padding:.8rem 1rem;border-radius:0 12px 12px 0;margin:.5rem 0 .8rem;font-style:italic;font-size:.92rem;line-height:1.4}

/* Buttons */
.btn-row{display:flex;gap:.55rem;flex-wrap:wrap;justify-content:center;margin:.7rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:var(--primary);color:#fff;border:none;padding:.65rem 1.1rem;border-radius:12px;font-size:.92rem;font-weight:700;cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 8px rgba(124,58,237,.25)}
.btn:active{transform:scale(.97)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);box-shadow:none}
.btn-success{background:var(--success);box-shadow:0 2px 8px rgba(16,185,129,.25)}
.btn-danger{background:var(--danger);box-shadow:0 2px 8px rgba(239,68,68,.25)}
.btn-warning{background:var(--warning);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.25)}
.btn-ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn-lg{width:100%;padding:.9rem;font-size:1.05rem;border-radius:14px}

/* Tabs */
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin:.7rem 0;padding-bottom:.3rem;-webkit-overflow-scrolling:touch}
.tab{flex-shrink:0;padding:.55rem .9rem;border-radius:999px;font-size:.85rem;font-weight:700;background:#f3e8ff;color:var(--muted);border:none;cursor:pointer;transition:all .15s}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.tab-content{display:none}.tab-content.active{display:block}

/* Quiz options */
.option{display:block;width:100%;text-align:left;padding:1rem 1.1rem;margin-bottom:.55rem;border-radius:14px;border:2px solid var(--border);background:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all .15s}
.option:active{transform:scale(.98)}
.option.correct{border-color:var(--success);background:var(--success-soft)}
.option.wrong{border-color:var(--danger);background:var(--danger-soft)}

/* Inputs */
.input-wrap{margin-bottom:.7rem}
.input-wrap input,.input-wrap textarea{width:100%;padding:1rem 1.1rem;border:2px solid var(--border);border-radius:14px;font-size:1.05rem;font-family:inherit;outline:none;transition:border-color .15s}
.input-wrap input:focus,.input-wrap textarea:focus{border-color:var(--primary)}

/* Feedback */
.feedback{margin-top:.6rem;padding:.75rem 1rem;border-radius:12px;font-size:.92rem;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--success-soft);color:#065f46}
.feedback.err{background:var(--danger-soft);color:#991b1b}

/* Flashcards */
.flashcard{perspective:1000px;height:230px;margin-bottom:1.1rem}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);border:2px solid rgba(124,58,237,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;text-align:center}
.flash-back{transform:rotateY(180deg);background:linear-gradient(135deg,#f3e8ff,#fce7f3)}

/* Match */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.match-item{padding:.9rem .55rem;border-radius:14px;border:2px solid var(--border);background:#fff;font-size:.88rem;font-weight:650;text-align:center;cursor:pointer;min-height:58px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.match-item.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.match-item.matched{opacity:.4;pointer-events:none;border-color:var(--success);background:var(--success-soft)}

/* Order words */
.order-bank{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1rem 0;min-height:48px}
.order-slot{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;align-items:center;min-height:56px;padding:.7rem;border:2px dashed #c4b5fd;border-radius:14px;background:#f5f3ff;margin-bottom:.8rem}
.order-chip{padding:.55rem .85rem;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:all .15s;user-select:none}
.order-chip:active{transform:scale(.96)}
.order-chip.used{opacity:.35;pointer-events:none}
.order-chip.in-slot{border-color:var(--primary);background:var(--primary-soft)}

/* Gaps */
.gap-sentence{font-size:1.1rem;font-weight:650;line-height:1.7;text-align:center;margin:1rem 0;padding:.5rem}
.gap-blank{display:inline-block;min-width:100px;border-bottom:3px solid var(--primary);margin:0 .2rem;padding:0 .3rem;color:var(--primary);font-weight:800}
.gap-options{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}

/* SRS */
.srs-grade{display:flex;gap:.55rem;margin-top:1.1rem}
.srs-grade .btn{flex:1;font-size:.85rem;padding:.7rem .4rem}

/* Sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(30,27,75,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--card);border-radius:24px 24px 0 0;z-index:80;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);padding:1rem 1.1rem calc(1.4rem + var(--safe-bottom));overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.12)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:5px;background:#d1d5db;border-radius:3px;margin:0 auto 1rem}

/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1.1rem}
.stat-box{background:var(--card);border-radius:16px;padding:1.1rem;text-align:center;box-shadow:var(--shadow);border:1px solid rgba(124,58,237,.08)}
.stat-box .num{font-size:1.7rem;font-weight:800;color:var(--primary)}
.stat-box .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:.15rem}
.progress-bar{height:10px;background:#e9d5ff;border-radius:5px;overflow:hidden;margin:.7rem 0}
.progress-bar span{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:5px}

/* Empty */
.empty-state{text-align:center;padding:3rem 1.5rem;color:var(--muted)}
.empty-state .big{font-size:3rem;margin-bottom:.6rem}
.empty-state p{font-size:1rem;font-weight:600;line-height:1.4}

.hidden{display:none!important}
.mic-status{text-align:center;font-size:.88rem;color:var(--muted);margin:.6rem 0;min-height:1.3rem;font-weight:600}
.hint{font-size:.88rem;color:var(--muted);margin-bottom:.5rem;font-weight:600}
.study-actions{display:flex;gap:.55rem;margin-bottom:.85rem;flex-wrap:wrap}
.study-actions .btn{flex:1;min-width:calc(50% - .3rem);font-size:.88rem;padding:.7rem .5rem}
.note{background:linear-gradient(135deg,#f3e8ff,#fce7f3);color:#5b21b6;padding:.7rem .9rem;border-radius:12px;font-size:.82rem;font-weight:650;margin-bottom:.9rem;line-height:1.35}
.section-title{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:1.1rem 0 .55rem}

/* Add form */
.add-form label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:.65rem 0 .3rem}
.add-form input,.add-form textarea{width:100%;padding:.85rem 1rem;border:2px solid var(--border);border-radius:12px;font-size:1.05rem;font-family:inherit}
.add-form .emoji-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.add-form .emoji-pick{font-size:1.45rem;width:44px;height:44px;border:2px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-form .emoji-pick.selected{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px rgba(124,58,237,.15)}

/* Mode header hint */
.mode-hint{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:.8rem;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <button class="btn-icon" id="btnMenu" type="button" aria-label="Меню">☰</button>
    <button class="btn-icon hidden" id="btnBack" type="button" aria-label="Назад">←</button>
    <div class="title" id="headerTitle">Словарь</div>
    <div class="stats">
      <span class="pill" id="statLearned">0</span>
      <span class="streak" id="statStreak">🔥0</span>
    </div>
  </header>

  <div class="due-bar" id="dueBar">
    <span id="dueText">Повторить сегодня: 0</span>
    <span>→</span>
  </div>

  <main class="main">
    <div id="viewUnits"></div>
    <div id="viewLessons" class="hidden"></div>
    <div id="viewStudy" class="hidden"></div>
    <div id="viewMode" class="hidden"></div>
  </main>

  <!-- Bottom navigation for quick access -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" type="button" data-nav="home" id="navHome">
      <span class="icon">🏠</span>
      <span>Юниты</span>
    </button>
    <button class="nav-btn" type="button" data-nav="practice" id="navPractice">
      <span class="icon">🎯</span>
      <span>Практика</span>
    </button>
    <button class="nav-btn" type="button" data-nav="review" id="navReview">
      <span class="icon">🔄</span>
      <span>Повтор</span>
    </button>
    <button class="nav-btn" type="button" data-nav="progress" id="navProgress">
      <span class="icon">📊</span>
      <span>Прогресс</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<nav class="side-menu" id="sideMenu">
  <div class="menu-header">✨ Vocab Trainer</div>
  <div class="menu-section">Как учить</div>
  <button class="menu-item" type="button" data-mode="flashcards"><span class="mi-icon">🃏</span> Карточки</button>
  <button class="menu-item" type="button" data-mode="match"><span class="mi-icon">🔗</span> Соедини пары</button>
  <button class="menu-item" type="button" data-mode="quiz"><span class="mi-icon">❓</span> Тест</button>
  <button class="menu-item" type="button" data-mode="gaps"><span class="mi-icon">📝</span> Пропуски</button>
  <button class="menu-item" type="button" data-mode="order"><span class="mi-icon">🔀</span> Порядок слов</button>
  <button class="menu-item" type="button" data-mode="spelling"><span class="mi-icon">✍️</span> Правописание</button>
  <button class="menu-item" type="button" data-mode="sentences"><span class="mi-icon">✏️</span> Предложения</button>
  <button class="menu-item" type="button" data-mode="pronunciation"><span class="mi-icon">🎤</span> Произношение</button>
  <div class="menu-section">Твой прогресс</div>
  <button class="menu-item" type="button" data-mode="difficult"><span class="mi-icon">⚠️</span> Сложные слова</button>
  <button class="menu-item" type="button" data-mode="progress"><span class="mi-icon">📊</span> Статистика</button>
  <button class="menu-item" type="button" data-mode="review"><span class="mi-icon">🔄</span> Повторение</button>
  <div class="menu-section">Навигация</div>
  <button class="menu-item" type="button" id="menuHome"><span class="mi-icon">🏠</span> Все юниты</button>
</nav>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="termSheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

var STORAGE_KEY="vocabAdj_v3";
var state={learned:{},difficult:{},srs:{},streak:0,lastStudyDate:null,points:0,dailyGoal:8,todayCount:0,currentUnit:null,currentLesson:null,modeSet:[],customWords:{}};
var viewStack=["units"];

function loadState(){try{var r=localStorage.getItem(STORAGE_KEY);if(r){var s=JSON.parse(r);Object.keys(s).forEach(function(k){if(k in state)state[k]=s[k];});}}catch(e){}var today=new Date().toDateString();if(state.lastStudyDate&&state.lastStudyDate!==today){var y=new Date();y.setDate(y.getDate()-1);if(state.lastStudyDate!==y.toDateString())state.streak=0;}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({learned:state.learned,difficult:state.difficult,srs:state.srs,streak:state.streak,lastStudyDate:state.lastStudyDate,points:state.points,dailyGoal:state.dailyGoal,todayCount:state.todayCount,customWords:state.customWords||{}}));}catch(e){}}
function markStudiedToday(){var today=new Date().toDateString();if(state.lastStudyDate!==today){var y=new Date();y.setDate(y.getDate()-1);state.streak=(state.lastStudyDate===y.toDateString())?(state.streak||0)+1:1;state.lastStudyDate=today;state.todayCount=0;}state.todayCount=(state.todayCount||0)+1;saveState();updateHeaderStats();}
function ensureSrs(term){if(!state.srs[term])state.srs[term]={interval:0,ease:2.5,due:Date.now(),reps:0};return state.srs[term];}
function gradeSrs(term,grade){var c=ensureSrs(term);c.reps++;if(grade===1){c.interval=.1;c.ease=Math.max(1.3,c.ease-.2);state.difficult[term]=true;}else if(grade===2){c.interval=Math.max(1,c.interval*1.2);c.ease=Math.max(1.3,c.ease-.05);}else{if(c.reps===1)c.interval=1;else if(c.reps===2)c.interval=3;else c.interval=Math.round(c.interval*c.ease);c.ease=Math.min(2.8,c.ease+.05);delete state.difficult[term];}c.due=Date.now()+c.interval*86400000;saveState();updateDueBar();}
function getAllTerms(){var list=[];curriculum.forEach(function(u){u.lessons.forEach(function(l){(l.words||[]).forEach(function(w){list.push(Object.assign({},w,{unitId:u.id,lessonId:l.id}));});getCustomForLesson(u.id,l.id).forEach(function(w){list.push(Object.assign({},w,{unitId:u.id,lessonId:l.id,custom:true}));});});});return list;}
function lessonKey(uid,lid){return String(uid)+"|"+String(lid);}
function getCustomForLesson(uid,lid){var k=lessonKey(uid,lid);return (state.customWords&&state.customWords[k])?state.customWords[k].slice():[];}
function getLessonWords(uid,lid){var u=curriculum.find(function(x){return x.id===uid;});if(!u)return[];var l=u.lessons.find(function(x){return x.id===lid;});var base=(l&&l.words)?l.words.slice():[];var custom=getCustomForLesson(uid,lid);return base.concat(custom);}
function addCustomWord(uid,lid,word){
  if(!state.customWords)state.customWords={};
  var k=lessonKey(uid,lid);
  if(!state.customWords[k])state.customWords[k]=[];
  var exists=state.customWords[k].some(function(w){return w.term.toLowerCase()===word.term.toLowerCase();});
  var base=getLessonWords(uid,lid);
  if(base.some(function(w){return w.term.toLowerCase()===word.term.toLowerCase();})||exists)return {ok:false,msg:"Такое слово уже есть в уроке"};
  state.customWords[k].push(word);
  saveState();
  return {ok:true};
}
function removeCustomWord(uid,lid,term){
  if(!state.customWords)return;
  var k=lessonKey(uid,lid);
  if(!state.customWords[k])return;
  state.customWords[k]=state.customWords[k].filter(function(w){return w.term!==term;});
  if(!state.customWords[k].length)delete state.customWords[k];
  saveState();
}
function getDueTerms(){var now=Date.now(),due=[];getAllTerms().forEach(function(w){var c=state.srs[w.term];if(c&&c.due<=now)due.push(w);else if(!c&&state.learned[w.term])due.push(w);});return due;}
function totalWords(){return getAllTerms().length;}function learnedCount(){return Object.keys(state.learned).length;}
function countLearnedInLesson(uid,lid){return getLessonWords(uid,lid).filter(function(w){return state.learned[w.term];}).length;}

function $(id){return document.getElementById(id);}
function show(el){if(el)el.classList.remove("hidden");}function hide(el){if(el)el.classList.add("hidden");}
function setTitle(t){var el=$("headerTitle");if(el)el.textContent=t;}
function updateHeaderStats(){var a=$("statLearned"),b=$("statStreak");if(a)a.textContent=learnedCount()+"/"+totalWords();if(b)b.textContent="🔥"+(state.streak||0);}
function updateDueBar(){var due=getDueTerms(),bar=$("dueBar");if(!bar)return;if(due.length){bar.classList.add("visible");var t=$("dueText");if(t)t.textContent="Повторить сегодня: "+due.length;}else bar.classList.remove("visible");}
function openMenu(){var m=$("sideMenu"),o=$("overlay");if(m)m.classList.add("open");if(o)o.classList.add("open");}
function closeMenu(){var m=$("sideMenu"),o=$("overlay");if(m)m.classList.remove("open");if(o)o.classList.remove("open");}
function openSheet(html){var c=$("sheetContent");if(c)c.innerHTML=html;var o=$("sheetOverlay"),s=$("termSheet");if(o)o.classList.add("open");if(s)s.classList.add("open");}
function closeSheet(){var o=$("sheetOverlay"),s=$("termSheet");if(o)o.classList.remove("open");if(s)s.classList.remove("open");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function speakText(text){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(text));u.lang="en-GB";u.rate=.9;window.speechSynthesis.speak(u);}

function setActiveNav(id){
  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.remove("active");});
  var btn=$(id);if(btn)btn.classList.add("active");
}

function goUnits(){
  viewStack=["units"];
  hide($("btnBack"));show($("btnMenu"));
  setTitle("Словарь");
  hide($("viewLessons"));hide($("viewStudy"));hide($("viewMode"));
  show($("viewUnits"));
  setActiveNav("navHome");
  renderUnits();
}
function goLessons(unitId){
  state.currentUnit=unitId;
  viewStack=["units","lessons"];
  show($("btnBack"));hide($("btnMenu"));
  setTitle("Unit "+unitId);
  hide($("viewUnits"));hide($("viewStudy"));hide($("viewMode"));
  show($("viewLessons"));
  setActiveNav("navHome");
  renderLessons(curriculum.find(function(x){return x.id===unitId;}));
}
function goStudy(unitId,lessonId){
  state.currentUnit=unitId;state.currentLesson=lessonId;
  viewStack=["units","lessons","study"];
  show($("btnBack"));hide($("btnMenu"));
  setTitle("Урок "+lessonId);
  hide($("viewUnits"));hide($("viewLessons"));hide($("viewMode"));
  show($("viewStudy"));
  setActiveNav("navHome");
  renderStudy(unitId,lessonId);
}
function handleBack(){
  if(viewStack[viewStack.length-1]==="mode"){
    viewStack.pop();
    var p=viewStack[viewStack.length-1];
    if(p==="study")goStudy(state.currentUnit,state.currentLesson);
    else if(p==="lessons")goLessons(state.currentUnit);
    else goUnits();
    return;
  }
  if(viewStack.length<=1)return;
  viewStack.pop();
  var t=viewStack[viewStack.length-1];
  if(t==="units")goUnits();
  else if(t==="lessons")goLessons(state.currentUnit);
  else if(t==="study")goStudy(state.currentUnit,state.currentLesson);
}

function renderUnits(){
  var cont=$("viewUnits");if(!cont)return;
  var html='<div class="welcome"><h2>Привет! 👋</h2><p>Выбери юнит → урок → учи слова. Нажми на слово, чтобы потренироваться. Внизу — быстрые кнопки.</p></div>';
  curriculum.forEach(function(u){
    var total=0,learned=0;
    u.lessons.forEach(function(l){total+=(l.words||[]).length;learned+=countLearnedInLesson(u.id,l.id);});
    var pct=total?Math.round(learned/total*100):0;
    html+='<div class="card unit-card" data-unit="'+u.id+'"><div class="unit-num">'+u.id+'</div><div class="unit-info"><h3>'+esc(u.title)+'</h3><p>'+learned+' из '+total+' слов · 4 урока</p><div class="progress-mini"><span style="width:'+pct+'%"></span></div></div></div>';
  });
  cont.innerHTML=html;
  cont.querySelectorAll(".unit-card").forEach(function(el){
    el.addEventListener("click",function(){goLessons(+el.getAttribute("data-unit"));});
  });
}

function renderLessons(unit){
  var cont=$("viewLessons");if(!cont||!unit)return;
  var html='<div class="card"><button class="btn btn-lg" type="button" id="btnStudyUnit">📚 Учить весь юнит</button></div>';
  unit.lessons.forEach(function(l){
    var total=(l.words||[]).length,learned=countLearnedInLesson(unit.id,l.id),empty=!total;
    html+='<div class="card lesson-card" data-lesson="'+esc(l.id)+'"><div class="unit-num" style="background:'+(empty?'#94a3b8':'linear-gradient(135deg,#10b981,#34d399)')+'">'+esc(String(l.id).slice(-1))+'</div><div class="unit-info"><h3>Урок '+esc(l.id)+'</h3><p>'+(empty?'Скоро появится':'')+esc(l.title)+'</p>'+(empty?'':'<div class="progress-mini"><span style="width:'+Math.round(learned/total*100)+'%"></span></div>')+'</div><span class="badge'+(empty?' empty':'')+'">'+(empty?'пусто':learned+'/'+total)+'</span></div>';
  });
  cont.innerHTML=html;
  cont.querySelectorAll(".lesson-card").forEach(function(el){
    el.addEventListener("click",function(){
      var lid=el.getAttribute("data-lesson");
      goStudy(unit.id,lid);
    });
  });
  var btn=$("btnStudyUnit");
  if(btn)btn.onclick=function(){
    var all=[];
    unit.lessons.forEach(function(l){(l.words||[]).forEach(function(w){all.push(w);});});
    if(!all.length){alert("В этом юните пока нет слов");return;}
    state.modeSet=all;
    startMode("flashcards");
  };
}

function renderStudy(unitId,lessonId){
  var words=getLessonWords(unitId,lessonId),cont=$("viewStudy");
  if(!cont)return;
  if(!words.length){
    cont.innerHTML='<div class="empty-state"><div class="big">📭</div><p>В этом уроке пока нет слов</p><button class="btn btn-lg" type="button" id="btnAddWordEmpty" style="margin-top:1.2rem">➕ Добавить своё слово</button></div>';
    var bae=$("btnAddWordEmpty");
    if(bae)bae.onclick=function(){openAddWordForm(unitId,lessonId);};
    return;
  }
  var custom=words.filter(function(w){return w.custom||w.note==="своё слово";});
  var rest=words.filter(function(w){return !(w.custom||w.note==="своё слово");});
  var groups=[],groupMap={};
  rest.forEach(function(w){
    var key=w.note||"Слова";
    if(!groupMap[key]){groupMap[key]=[];groups.push(key);}
    groupMap[key].push(w);
  });
  var html='<div class="note">💡 Нажми на слово — перевод и тренировка. Выбери упражнение ниже.</div>';
  html+='<div class="study-actions"><button class="btn" type="button" id="btnPracticeAll">🎯 Практика</button><button class="btn btn-outline" type="button" id="btnFlashThis">🃏 Карточки</button></div>';
  html+='<div class="study-actions"><button class="btn btn-outline" type="button" id="btnMatchThis">🔗 Пары</button><button class="btn btn-outline" type="button" id="btnQuizThis">❓ Тест</button></div>';
  html+='<div class="study-actions"><button class="btn btn-outline" type="button" id="btnGapsThis">📝 Пропуски</button><button class="btn btn-outline" type="button" id="btnOrderThis">🔀 Порядок</button></div>';
  html+='<div class="study-actions"><button class="btn btn-outline" type="button" id="btnSpellThis">✍️ Правописание</button><button class="btn btn-outline" type="button" id="btnSentThis">✏️ Предложения</button></div>';
  html+='<div class="study-actions"><button class="btn btn-outline" type="button" id="btnAddWord" style="flex:1">➕ Своё слово</button></div>';

  function chipHtml(w){
    var cls=state.learned[w.term]?" learned":(state.difficult[w.term]?" difficult":"");
    if(w.custom||w.note==="своё слово")cls+=" custom";
    return '<div class="word-chip'+cls+'" data-term="'+esc(w.term)+'"><span class="emoji">'+(w.emoji||"📝")+'</span><span class="term">'+esc(w.term)+'</span></div>';
  }
  function titleCase(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  groups.forEach(function(key){
    html+='<div class="section-title">'+esc(titleCase(key))+'</div><div class="word-grid">';
    groupMap[key].forEach(function(w){html+=chipHtml(w);});
    html+='</div>';
  });
  if(custom.length){
    html+='<div class="section-title">Мои слова</div><div class="word-grid">';
    custom.forEach(function(w){html+=chipHtml(w);});
    html+='</div>';
  }
  cont.innerHTML=html;
  cont.querySelectorAll(".word-chip").forEach(function(el){
    el.onclick=function(){
      var t=el.getAttribute("data-term");
      var w=words.find(function(x){return x.term===t;});
      if(w)openTermPractice(w);
    };
  });

function openTermPractice(word){
  if(!word)return;

  var isCustom=!!(word.custom||word.note==="своё слово");
  var html='<div class="term-big">'+esc(word.term)+'</div>';
  html+='<div class="phonetic">'+esc(word.phonetic||"")+'</div>';
  html+='<div class="illustration">'+(word.emoji||"📝")+'</div>';
  html+='<div class="meaning-box"><strong>Значение:</strong> '+esc(word.definition)+(word.note?' <span style="color:var(--muted);font-size:.85rem">('+esc(word.note)+')</span>':'')+'</div>';

  html+='<div class="btn-row"><button class="btn '+(isL?"btn-success":"btn-outline")+'" type="button" id="btnLearned">'+(isL?"✓ Выучено":"Отметить выученным")+'</button>';
  html+='<button class="btn '+(isD?"btn-warning":"btn-outline")+'" type="button" id="btnDifficult">'+(isD?"⚠️ Сложное":"Сложное")+'</button></div>';
  if(isCustom)html+='<div class="btn-row"><button class="btn btn-danger" type="button" id="btnDelCustom">🗑 Удалить</button></div>';
  html+='<div class="tabs" id="practiceTabs">';
  html+='<button class="tab active" type="button" data-tab="mc">Выбор</button>';
  html+='<button class="tab" type="button" data-tab="spell">Написание</button>';
  html+='<button class="tab" type="button" data-tab="sentence">Предложение</button>';
  html+='<button class="tab" type="button" data-tab="speak">Сказать</button>';
  html+='</div>';
  html+='<div id="tabMc" class="tab-content active"></div>';
  html+='<div id="tabSpell" class="tab-content"></div>';
  html+='<div id="tabSentence" class="tab-content"></div>';
  html+='<div id="tabSpeak" class="tab-content"></div>';
  openSheet(html);
  $("btnHear").onclick=function(){speakText(word.term);};
  $("btnLearned").onclick=function(){
    if(state.learned[word.term])delete state.learned[word.term];
    else{state.learned[word.term]=true;ensureSrs(word.term);markStudiedToday();state.points+=5;}
    saveState();updateHeaderStats();openTermPractice(word);
    if(state.currentLesson)renderStudy(state.currentUnit,state.currentLesson);
  };
  $("btnDifficult").onclick=function(){
    if(state.difficult[word.term])delete state.difficult[word.term];
    else state.difficult[word.term]=true;
    saveState();openTermPractice(word);
    if(state.currentLesson)renderStudy(state.currentUnit,state.currentLesson);
  };
  var bdel=$("btnDelCustom");
  if(bdel)bdel.onclick=function(){
    if(!confirm("Удалить «"+word.term+"»?"))return;
    removeCustomWord(state.currentUnit,state.currentLesson,word.term);
    delete state.learned[word.term];
    delete state.difficult[word.term];
    if(state.srs)delete state.srs[word.term];
    saveState();closeSheet();
    renderStudy(state.currentUnit,state.currentLesson);
    updateHeaderStats();renderUnits();
  };
  setupTabs(word);
}

function setupTabs(word){
  document.querySelectorAll("#practiceTabs .tab").forEach(function(t){
    t.onclick=function(){
      document.querySelectorAll("#practiceTabs .tab").forEach(function(x){x.classList.remove("active");});
      t.classList.add("active");
      document.querySelectorAll("#sheetContent .tab-content").forEach(function(c){c.classList.remove("active");});
      var map={mc:"tabMc",spell:"tabSpell",sentence:"tabSentence",speak:"tabSpeak"};
      var id=map[t.getAttribute("data-tab")];
      if($(id))$(id).classList.add("active");
      var tab=t.getAttribute("data-tab");
      if(tab==="mc")renderMc(word);
      else if(tab==="spell")renderSpell(word);
      else if(tab==="sentence")renderSentence(word);
      else if(tab==="speak")renderSpeak(word);
    };
  });
  renderMc(word);
}

function renderMc(word){
  var cont=$("tabMc");if(!cont)return;
  var all=getAllTerms().map(function(w){return w.definition;}),opts=[word.definition],g=0;
  while(opts.length<4&&g++<40){var r=all[Math.floor(Math.random()*all.length)];if(r&&opts.indexOf(r)<0)opts.push(r);}
  opts=shuffle(opts);
  var html='<p class="hint">Выбери правильный перевод:</p>';
  opts.forEach(function(o){html+='<button class="option" type="button" data-val="'+esc(o)+'">'+esc(o)+'</button>';});
  html+='<div class="feedback" id="mcFb"></div>';
  cont.innerHTML=html;
  cont.querySelectorAll(".option").forEach(function(btn){
    btn.onclick=function(){
      var ok=btn.getAttribute("data-val")===word.definition;
      cont.querySelectorAll(".option").forEach(function(b){
        b.disabled=true;
        if(b.getAttribute("data-val")===word.definition)b.classList.add("correct");
        else if(b===btn&&!ok)b.classList.add("wrong");
      });
      var fb=$("mcFb");
      if(fb){fb.className="feedback show "+(ok?"ok":"err");fb.textContent=ok?"✓ Верно! Молодец 🎉":"✗ Правильный ответ выделен";}
      if(ok){state.points+=2;markStudiedToday();saveState();}
    };
  });
}

function startRec(target,statusId,fbId){
  var status=$(statusId),fb=$(fbId),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){if(status)status.textContent="Не поддерживается в этом браузере";return;}
  try{
    var rec=new SR();rec.lang="en-US";rec.interimResults=false;
    if(status)status.textContent="Слушаю... 🎤";
    if(fb){fb.className="feedback";fb.textContent="";}
    rec.onresult=function(e){
      var said=(e.results[0][0].transcript||"").toLowerCase().trim();
      if(status)status.textContent="«"+said+"»";
      var norm=function(s){return s.replace(/[^\w\s]/g,"").replace(/\s+/g," ").trim();};
      var ok=norm(said)===norm(target.toLowerCase())||norm(said).indexOf(norm(target.toLowerCase()))>=0;
      if(fb){fb.className="feedback show "+(ok?"ok":"err");fb.textContent=ok?"✓ Звучит хорошо!":"Цель: "+target;}
      if(ok){state.points+=5;markStudiedToday();saveState();}
    };
    rec.onerror=function(e){if(status)status.textContent=e.error==="not-allowed"?"Разреши микрофон":"Ошибка: "+e.error;};
    rec.start();
  }catch(err){if(status)status.textContent="Нужен Chrome + https";}
}

function startMode(mode){

function runFlash(words){

function runMatch(words){
  setTitle("Соедини");
  var cont=$("viewMode");
  var sample=shuffle(words).slice(0,Math.min(6,words.length)),items=[];
  sample.forEach(function(w){items.push({type:"t",text:w.term,id:w.term});items.push({type:"d",text:w.definition,id:w.term});});
  items=shuffle(items);
  var sel=null,matched=0;
  cont.innerHTML='<p class="mode-hint">Найди пары: слово ↔ перевод</p><div class="match-grid" id="mg"></div><p style="text-align:center;margin-top:.9rem;font-weight:700;font-size:1rem" id="ms">0 / '+sample.length+'</p>';
  var grid=$("mg");
  items.forEach(function(it){
    var el=document.createElement("div");
    el.className="match-item";
    el.textContent=it.text;
    el.dataset.id=it.id;
    el.dataset.type=it.type;
    el.onclick=function(){
      if(el.classList.contains("matched"))return;
      if(!sel){sel=el;el.classList.add("selected");}
      else if(sel===el){sel.classList.remove("selected");sel=null;}
      else{
        if(sel.dataset.id===el.dataset.id&&sel.dataset.type!==el.dataset.type){
          sel.classList.add("matched");el.classList.add("matched");
          sel.classList.remove("selected");sel=null;
          matched++;
          $("ms").textContent=matched+" / "+sample.length;
          if(matched===sample.length){state.points+=10;markStudiedToday();saveState();}
        }else{sel.classList.remove("selected");sel=null;}
      }
    };
    grid.appendChild(el);
  });
}

function runGaps(words){
  setTitle("Пропуски");
  var cont=$("viewMode");
  if(!words.length){cont.innerHTML='<div class="empty-state"><div class="big">📭</div><p>Нет слов</p></div>';return;}
  var list=shuffle(words.filter(function(w){return w.example&&w.example.toLowerCase().indexOf(w.term.toLowerCase())>=0;}));
  if(list.length<3)list=shuffle(words.slice());
  var idx=0,score=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">📝</div><p style="font-size:1.2rem;font-weight:800">'+score+' из '+list.length+'</p><p style="margin-top:.35rem">'+((score/list.length)>=.7?"Супер! 🎉":"Ещё раз — и будет лучше!")+'</p><button class="btn btn-lg" type="button" id="gapsAgain" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("gapsAgain").onclick=function(){runGaps(words);};
      state.points+=score*2;markStudiedToday();saveState();updateHeaderStats();
      return;
    }
    var w=list[idx];
    var ex=w.example||("I use "+w.term+" every day.");
    var re=new RegExp(w.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
    var gapped=ex.replace(re,'<span class="gap-blank">______</span>');
    if(gapped===ex)gapped=ex+' <span class="gap-blank">______</span>';
    var distractors=[];
    var pool=shuffle(words.filter(function(x){return x.term!==w.term;}));
    for(var i=0;i<pool.length&&distractors.length<3;i++)distractors.push(pool[i].term);
    while(distractors.length<3)distractors.push("word"+(distractors.length+1));
    var opts=shuffle([w.term].concat(distractors.slice(0,3)));
    var html='<p class="mode-hint">'+(idx+1)+' / '+list.length+' · Вставь пропущенное слово</p>';
    html+='<div class="illustration">'+w.emoji+'</div>';
    html+='<div class="gap-sentence">'+gapped+'</div>';
    html+='<p class="hint" style="text-align:center">Перевод: '+esc(w.definition)+'</p>';
    html+='<div class="gap-options">';
    opts.forEach(function(o){html+='<button class="option" type="button" data-val="'+esc(o)+'">'+esc(o)+'</button>';});
    html+='</div><div class="feedback" id="gapsFb"></div>';
    cont.innerHTML=html;
    cont.querySelectorAll(".option").forEach(function(btn){
      btn.onclick=function(){
        var ok=btn.getAttribute("data-val").toLowerCase()===w.term.toLowerCase();
        cont.querySelectorAll(".option").forEach(function(b){
          b.disabled=true;
          if(b.getAttribute("data-val").toLowerCase()===w.term.toLowerCase())b.classList.add("correct");
          else if(b===btn&&!ok)b.classList.add("wrong");
        });
        if(ok)score++;
        var fb=$("gapsFb");
        fb.className="feedback show "+(ok?"ok":"err");
        fb.textContent=ok?"✓ Верно!":"Правильно: "+w.term;
        setTimeout(function(){idx++;next();},1000);
      };
    });
  }
  next();
}

function runOrder(words){
  setTitle("Порядок слов");
  var cont=$("viewMode");
  if(!words.length){cont.innerHTML='<div class="empty-state"><div class="big">📭</div><p>Нет слов</p></div>';return;}
  var list=shuffle(words.filter(function(w){return w.example&&w.example.split(/\s+/).length>=3&&w.example.split(/\s+/).length<=10;}));
  if(list.length<2)list=shuffle(words.filter(function(w){return w.example;}).slice());
  if(!list.length){cont.innerHTML='<div class="empty-state"><div class="big">📭</div><p>Нет подходящих предложений</p></div>';return;}
  var idx=0,score=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">🔀</div><p style="font-size:1.2rem;font-weight:800">'+score+' из '+list.length+'</p><p style="margin-top:.35rem">'+((score/list.length)>=.7?"Отлично! 🎉":"Тренируйся ещё!")+'</p><button class="btn btn-lg" type="button" id="orderAgain" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("orderAgain").onclick=function(){runOrder(words);};
      state.points+=score*3;markStudiedToday();saveState();updateHeaderStats();
      return;
    }
    var w=list[idx];
    var sentence=w.example.replace(/[.?!,;:]+$/g,"").trim();
    var tokens=sentence.split(/\s+/);
    var shuffled=shuffle(tokens.slice());
    // ensure not already in order
    var same=true;
    for(var i=0;i<tokens.length;i++){if(tokens[i]!==shuffled[i]){same=false;break;}}
    if(same&&tokens.length>1)shuffled=shuffle(tokens.slice());
    var picked=[];
    cont.innerHTML=
      '<p class="mode-hint">'+(idx+1)+' / '+list.length+' · Собери предложение</p>'+
      '<div class="illustration">'+w.emoji+'</div>'+
      '<p class="hint" style="text-align:center;margin-bottom:.3rem">Слово: <strong>'+esc(w.term)+'</strong> · '+esc(w.definition)+'</p>'+
      '<div class="order-slot" id="orderSlot"><span style="color:var(--muted);font-size:.85rem">Нажимай слова по порядку →</span></div>'+
      '<div class="order-bank" id="orderBank"></div>'+
      '<button class="btn btn-lg" type="button" id="orderCheck" style="margin-top:.5rem">Проверить</button>'+
      '<button class="btn btn-ghost btn-lg" type="button" id="orderReset" style="margin-top:.35rem">Сбросить</button>'+
      '<div class="feedback" id="orderFb"></div>';
    var bank=$("orderBank");
    shuffled.forEach(function(tok,ti){
      var chip=document.createElement("button");
      chip.type="button";
      chip.className="order-chip";
      chip.textContent=tok;
      chip.dataset.idx=String(ti);
      chip.dataset.tok=tok;
      chip.onclick=function(){
        if(chip.classList.contains("used"))return;
        chip.classList.add("used");
        picked.push(tok);
        renderSlot();
      };
      bank.appendChild(chip);
    });
    function renderSlot(){
      var slot=$("orderSlot");
      if(!picked.length){
        slot.innerHTML='<span style="color:var(--muted);font-size:.85rem">Нажимай слова по порядку →</span>';
        return;
      }
      slot.innerHTML="";
      picked.forEach(function(t,pi){
        var c=document.createElement("button");
        c.type="button";
        c.className="order-chip in-slot";
        c.textContent=t;
        c.onclick=function(){
          picked.splice(pi,1);
          // re-enable matching bank chip
          var chips=bank.querySelectorAll(".order-chip");
          for(var i=0;i<chips.length;i++){
            if(chips[i].dataset.tok===t&&chips[i].classList.contains("used")){
              chips[i].classList.remove("used");
              break;
            }
          }
          renderSlot();
        };
        slot.appendChild(c);
      });
    }
    $("orderReset").onclick=function(){
      picked=[];
      bank.querySelectorAll(".order-chip").forEach(function(c){c.classList.remove("used");});
      renderSlot();
      var fb=$("orderFb");fb.className="feedback";fb.textContent="";
    };
    $("orderCheck").onclick=function(){
      var ok=picked.length===tokens.length;
      if(ok){for(var i=0;i<tokens.length;i++){if(picked[i].toLowerCase()!==tokens[i].toLowerCase()){ok=false;break;}}}
      var fb=$("orderFb");
      fb.className="feedback show "+(ok?"ok":"err");
      if(ok){
        score++;
        fb.textContent="✓ Верно!";
        state.points+=3;markStudiedToday();saveState();
        setTimeout(function(){idx++;next();},1100);
      }else{
        fb.innerHTML="✗ Правильный порядок:<br><strong>"+esc(sentence)+"</strong>";
        setTimeout(function(){idx++;next();},2200);
      }
    };
  }
  next();
}

function runQuiz(words){
  setTitle("Тест");
  var cont=$("viewMode");
  if(!words.length)return;
  var list=shuffle(words),idx=0,score=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">🏆</div><p style="font-size:1.25rem;font-weight:800">'+score+' из '+list.length+'</p><p style="margin-top:.4rem">'+((score/list.length)>=.7?"Отличный результат! 🎉":"Ещё потренируйся — получится!")+'</p><button class="btn btn-lg" type="button" id="qa" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("qa").onclick=function(){runQuiz(words);};
      state.points+=score*2;markStudiedToday();saveState();updateHeaderStats();
      return;
    }
    var w=list[idx],all=getAllTerms().map(function(x){return x.definition;}),opts=[w.definition],g=0;
    while(opts.length<4&&g++<40){var r=all[Math.floor(Math.random()*all.length)];if(r&&opts.indexOf(r)<0)opts.push(r);}
    opts=shuffle(opts);
    var html='<p class="mode-hint">'+(idx+1)+' / '+list.length+'</p><div class="term-big" style="margin:1rem 0">'+esc(w.term)+'</div><div class="illustration">'+w.emoji+'</div>';
    opts.forEach(function(o){html+='<button class="option" type="button" data-val="'+esc(o)+'">'+esc(o)+'</button>';});
    html+='<div class="feedback" id="qfb"></div>';
    cont.innerHTML=html;
    cont.querySelectorAll(".option").forEach(function(btn){
      btn.onclick=function(){
        var ok=btn.getAttribute("data-val")===w.definition;
        cont.querySelectorAll(".option").forEach(function(b){
          b.disabled=true;
          if(b.getAttribute("data-val")===w.definition)b.classList.add("correct");
          else if(b===btn&&!ok)b.classList.add("wrong");
        });
        if(ok)score++;
        var fb=$("qfb");
        fb.className="feedback show "+(ok?"ok":"err");
        fb.textContent=ok?"✓":w.definition;
        setTimeout(function(){idx++;next();},900);
      };
    });
  }
  next();
}

function runSpell(words){
  setTitle("Правописание");
  var cont=$("viewMode");
  var list=shuffle(words),idx=0,score=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">✍️</div><p style="font-size:1.2rem;font-weight:800">'+score+' / '+list.length+'</p><button class="btn btn-lg" type="button" id="sa" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("sa").onclick=function(){runSpell(words);};
      return;
    }
    var w=list[idx];
    cont.innerHTML='<p class="mode-hint">'+(idx+1)+' / '+list.length+' · Напиши слово по-английски</p><div class="illustration">'+w.emoji+'</div><p style="text-align:center;margin-bottom:.9rem;font-weight:650;font-size:1.05rem">'+esc(w.definition)+'</p><div class="btn-row"><button class="btn btn-outline" type="button" id="sh">🔊 Послушать</button></div><div class="input-wrap"><input id="si" type="text" placeholder="Пиши здесь..." autocomplete="off" spellcheck="false"></div><button class="btn btn-lg" type="button" id="sc">Проверить</button><div class="feedback" id="sf"></div>';
    $("sh").onclick=function(){speakText(w.term);};
    $("sc").onclick=function(){
      var v=($("si").value||"").trim().toLowerCase().replace(/\s+/g," ");
      var ok=v===w.term.toLowerCase();
      if(ok)score++;
      var fb=$("sf");
      fb.className="feedback show "+(ok?"ok":"err");
      fb.textContent=ok?"✓ Верно!":"Правильно: "+w.term;
      setTimeout(function(){idx++;next();},950);
    };
  }
  next();
}

function runPron(words){
  setTitle("Произношение");
  var cont=$("viewMode");
  var list=shuffle(words).slice(0,Math.min(8,words.length)),idx=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">🎤</div><p style="font-weight:700">Готово!</p><button class="btn btn-lg" type="button" id="pa" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("pa").onclick=function(){runPron(words);};
      return;
    }
    var w=list[idx];
    cont.innerHTML='<p class="mode-hint">'+(idx+1)+' / '+list.length+'</p><div class="term-big">'+esc(w.term)+'</div><div class="phonetic">'+esc(w.phonetic||"")+'</div><div class="illustration">'+w.emoji+'</div><button class="btn btn-lg" type="button" id="pm">🎤 Говори</button><div class="mic-status" id="pst"></div><div class="feedback" id="pfb"></div><button class="btn btn-ghost btn-lg" type="button" id="psk" style="margin-top:.5rem">Пропустить →</button>';
    $("pm").onclick=function(){startRec(w.term,"pst","pfb");};
    $("psk").onclick=function(){idx++;next();};
  }
  next();
}

function runSentences(words){
  setTitle("Предложения");
  var cont=$("viewMode");
  if(!words.length){cont.innerHTML='<div class="empty-state"><div class="big">📭</div></div>';return;}
  var list=shuffle(words),idx=0,score=0;
  function next(){
    if(idx>=list.length){
      cont.innerHTML='<div class="empty-state"><div class="big">✏️</div><p style="font-size:1.2rem;font-weight:800">Готово: '+score+' / '+list.length+'</p><button class="btn btn-lg" type="button" id="sentAgain" style="margin-top:1.2rem">Ещё раз</button></div>';
      $("sentAgain").onclick=function(){runSentences(words);};
      state.points+=score*3;markStudiedToday();saveState();updateHeaderStats();
      return;
    }
    var w=list[idx];
    cont.innerHTML=
      '<p class="mode-hint">Предложение '+(idx+1)+' / '+list.length+'</p>'+
      '<div class="illustration">'+w.emoji+'</div>'+
      '<div class="term-big" style="margin:.4rem 0">'+esc(w.term)+'</div>'+
      '<div class="phonetic">'+esc(w.phonetic||"")+'</div>'+
      '<div class="meaning-box"><strong>Значение:</strong> '+esc(w.definition)+'</div>'+
      '<div class="example-box"><div style="font-size:.78rem;color:var(--muted);margin-bottom:.25rem;font-style:normal;font-weight:700">Пример:</div>«'+esc(w.example)+'»</div>'+
      '<p class="hint" style="margin-top:.8rem">Напиши <strong>своё</strong> предложение:</p>'+
      '<div class="input-wrap"><textarea id="sentModeInput" rows="3" placeholder="Write your sentence in English..."></textarea></div>'+
      '<button class="btn btn-lg" type="button" id="sentModeCheck">Проверить</button>'+
      '<button class="btn btn-ghost btn-lg" type="button" id="sentModeSkip" style="margin-top:.4rem">Пропустить →</button>'+
      '<div class="feedback" id="sentModeFb"></div>';
    $("sentModeCheck").onclick=function(){
      var v=($("sentModeInput").value||"").trim();
      var low=v.toLowerCase();
      var fb=$("sentModeFb");
      if(v.length<5){fb.className="feedback show err";fb.textContent="Напиши чуть длиннее 🙂";return;}
      var ok=low.indexOf(w.term.toLowerCase())>=0;
      if(ok)score++;
      fb.className="feedback show "+(ok?"ok":"err");
      fb.innerHTML=ok
        ?('✓ Круто! Ты использовал(а) «'+esc(w.term)+'».<br><span style="font-size:.85rem">Модель: «'+esc(w.example)+'»</span>')
        :('✗ В предложении нет «'+esc(w.term)+'».<br>Попробуй так: «'+esc(w.example)+'»');
      if(ok){state.points+=3;markStudiedToday();saveState();}
      setTimeout(function(){idx++;next();},ok?1300:1900);
    };
    $("sentModeSkip").onclick=function(){idx++;next();};
  }
  next();
}

function runDiff(){
  setTitle("Сложные");
  var cont=$("viewMode");
  var diffs=getAllTerms().filter(function(w){return state.difficult[w.term];});
  state.modeSet=diffs;
  if(!diffs.length){cont.innerHTML='<div class="empty-state"><div class="big">👍</div><p>Пока нет сложных слов — супер!</p></div>';return;}
  var html='<p class="mode-hint">'+diffs.length+' слов, которые стоит повторить</p><div class="study-actions"><button class="btn" type="button" id="df">🃏 Карточки</button><button class="btn btn-outline" type="button" id="dq">❓ Тест</button></div><div class="word-grid" id="dg"></div>';
  cont.innerHTML=html;
  var g=$("dg");
  diffs.forEach(function(w){
    var el=document.createElement("div");
    el.className="word-chip difficult";
    el.innerHTML='<span class="emoji">'+w.emoji+'</span><span class="term">'+esc(w.term)+'</span>';
    el.onclick=function(){openTermPractice(w);};
    g.appendChild(el);
  });
  $("df").onclick=function(){startMode("flashcards");};
  $("dq").onclick=function(){startMode("quiz");};
}

function runProg(){
  setTitle("Прогресс");
  var cont=$("viewMode");
  var total=totalWords(),learned=learnedCount(),pct=total?Math.round(learned/total*100):0;
  cont.innerHTML='<div class="stat-grid"><div class="stat-box"><div class="num">'+learned+'</div><div class="lbl">Выучено</div></div><div class="stat-box"><div class="num">'+total+'</div><div class="lbl">Всего</div></div><div class="stat-box"><div class="num">'+(state.streak||0)+'</div><div class="lbl">Серия дней</div></div><div class="stat-box"><div class="num">'+(state.points||0)+'</div><div class="lbl">Очки</div></div></div><div class="card"><p style="font-size:.95rem;font-weight:700">Общий прогресс</p><div class="progress-bar"><span style="width:'+pct+'%"></span></div><p style="font-size:.85rem;color:var(--muted);font-weight:600">'+pct+'% · Сегодня: '+(state.todayCount||0)+' / '+state.dailyGoal+'</p></div><div class="card"><p style="font-weight:650">К повторению: <strong>'+getDueTerms().length+'</strong></p><p style="font-weight:650;margin-top:.35rem">Сложных: <strong>'+Object.keys(state.difficult).length+'</strong></p></div><button class="btn btn-outline btn-lg" type="button" id="br" style="margin-top:.9rem">Сбросить прогресс</button>';
  $("br").onclick=function(){
    if(confirm("Точно сбросить весь прогресс?")){
      state.learned={};state.difficult={};state.srs={};state.points=0;state.streak=0;state.todayCount=0;
      saveState();updateHeaderStats();updateDueBar();runProg();
    }
  };
}

function runReview(){
  setTitle("Повторение");
  var cont=$("viewMode");
  var due=getDueTerms();
  if(!due.length){cont.innerHTML='<div class="empty-state"><div class="big">✨</div><p>Нечего повторять — ты молодец!</p></div>';return;}
  var idx=0;
  function show(){
    if(idx>=due.length){
      cont.innerHTML='<div class="empty-state"><div class="big">🎉</div><p style="font-weight:700">Всё повторил(а)!</p></div>';
      updateDueBar();
      return;
    }
    var w=due[idx];
    cont.innerHTML='<p class="mode-hint">'+(idx+1)+' / '+due.length+'</p><div class="term-big">'+esc(w.term)+'</div><div class="phonetic">'+esc(w.phonetic||"")+'</div><div class="illustration">'+w.emoji+'</div><div class="btn-row"><button class="btn btn-outline" type="button" id="rh">🔊</button><button class="btn btn-outline" type="button" id="rs">Показать</button></div><div id="rm" class="meaning-box hidden">'+esc(w.definition)+'<div class="example-box" style="margin-top:.5rem">«'+esc(w.example)+'»</div></div><p class="hint" style="margin-top:1.1rem">Как вспомнил(а)?</p><div class="srs-grade"><button class="btn btn-danger" type="button" data-g="1">Сложно</button><button class="btn btn-warning" type="button" data-g="2">Средне</button><button class="btn btn-success" type="button" data-g="3">Легко</button></div>';
    $("rh").onclick=function(){speakText(w.term);};
    $("rs").onclick=function(){$("rm").classList.remove("hidden");};
    cont.querySelectorAll("[data-g]").forEach(function(b){
      b.onclick=function(){
        var g=+b.getAttribute("data-g");
        gradeSrs(w.term,g);
        if(g>=2)state.learned[w.term]=true;
        markStudiedToday();saveState();
        idx++;show();
      };
    });
  }
  show();
}

function openAddWordForm(uid,lid){
  var emojis=["📝","📘","⭐","🔥","💡","🎯","🗣️","✏️","🌟","📌","🚗","🏨","⚽","👕","👖","💎","⚡","🐭","✨","🏷️","🧼","📜"];
  var emojiHtml=emojis.map(function(e,i){return '<button type="button" class="emoji-pick'+(i===0?' selected':'')+'" data-e="'+e+'">'+e+'</button>';}).join("");
  var html=
    '<div class="term-big" style="font-size:1.2rem">➕ Новое слово</div>'+
    '<p class="hint">Урок '+esc(String(lid))+' · сохранится в этом браузере</p>'+
    '<div class="add-form">'+
      '<label>Английское слово / фраза *</label>'+
      '<input type="text" id="awTerm" placeholder="например: a red bag" autocomplete="off" spellcheck="false">'+
      '<label>Русский перевод *</label>'+
      '<input type="text" id="awDef" placeholder="например: красная сумка" autocomplete="off">'+
      '<label>Транскрипция (необязательно)</label>'+
      '<input type="text" id="awPhon" placeholder="/ə red bæɡ/" autocomplete="off">'+
      '<label>Пример предложения (необязательно)</label>'+
      '<textarea id="awEx" rows="2" placeholder="She has a red bag."></textarea>'+
      '<label>Эмодзи</label>'+
      '<div class="emoji-row" id="awEmojiRow">'+emojiHtml+'</div>'+
      '<input type="hidden" id="awEmoji" value="📝">'+
      '<div class="feedback" id="awFb"></div>'+
      '<button class="btn btn-lg" type="button" id="awSave" style="margin-top:.85rem">Сохранить</button>'+
      '<button class="btn btn-ghost btn-lg" type="button" id="awCancel" style="margin-top:.4rem">Отмена</button>'+
    '</div>';
  openSheet(html);
  document.querySelectorAll("#awEmojiRow .emoji-pick").forEach(function(btn){
    btn.onclick=function(){
      document.querySelectorAll("#awEmojiRow .emoji-pick").forEach(function(b){b.classList.remove("selected");});
      btn.classList.add("selected");
      $("awEmoji").value=btn.getAttribute("data-e");
    };
  });
  $("awCancel").onclick=closeSheet;
  $("awSave").onclick=function(){
    var term=($("awTerm").value||"").trim();
    var def=($("awDef").value||"").trim();
    var phon=($("awPhon").value||"").trim();
    var ex=($("awEx").value||"").trim();
    var emoji=$("awEmoji").value||"📝";
    var fb=$("awFb");
    if(!term||!def){fb.className="feedback show err";fb.textContent="Нужны английское слово и перевод";return;}
    if(!ex)ex="This is "+term+".";
    var word={term:term,phonetic:phon,definition:def,example:ex,emoji:emoji,note:"своё слово",custom:true};
    var res=addCustomWord(uid,lid,word);
    if(!res.ok){fb.className="feedback show err";fb.textContent=res.msg;return;}
    fb.className="feedback show ok";fb.textContent="✓ Добавлено: "+term;
    setTimeout(function(){closeSheet();renderStudy(uid,lid);renderUnits();updateHeaderStats();},600);
  };
}

function init(){
  loadState();
  if(!state.customWords)state.customWords={};
  updateHeaderStats();
  updateDueBar();
  renderUnits();

  $("btnMenu").onclick=openMenu;
  $("overlay").onclick=closeMenu;
  $("btnBack").onclick=handleBack;
  $("dueBar").onclick=function(){state.modeSet=getDueTerms();startMode("review");};
  $("sheetOverlay").onclick=closeSheet;
  $("menuHome").onclick=function(){closeMenu();goUnits();};

  // Bottom nav
  $("navHome").onclick=function(){goUnits();};
  $("navPractice").onclick=function(){
    var words=state.currentLesson?getLessonWords(state.currentUnit,state.currentLesson):getAllTerms();
    if(!words.length)words=getAllTerms();
    state.modeSet=words;
    startMode("practiceHub");
  };
  $("navReview").onclick=function(){state.modeSet=getDueTerms();startMode("review");};
  $("navProgress").onclick=function(){startMode("progress");};

  document.querySelectorAll(".menu-item[data-mode]").forEach(function(btn){
    btn.onclick=function(){
      var mode=btn.getAttribute("data-mode");
      if(mode==="difficult"||mode==="progress"||mode==="review"){
        state.modeSet=[];
        startMode(mode);
      }else{
        state.modeSet=state.currentLesson?getLessonWords(state.currentUnit,state.currentLesson):getAllTerms();
        if(!state.modeSet.length)state.modeSet=getAllTerms();
        startMode(mode);
      }
    };
  });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
